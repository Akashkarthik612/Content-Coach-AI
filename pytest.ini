[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    integration: real Postgres (TEST_DATABASE_URL), LLM faked
    smoke: whole stack over HTTP, only Gemini and Supabase JWKS faked
log_cli = true
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:sqlalchemy.*
