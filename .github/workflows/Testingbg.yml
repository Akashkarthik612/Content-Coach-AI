name: testing backend

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-test.txt'
      - 'pytest.ini'
      - '.github/workflows/Testinbg.yml'

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_content_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_content_coach
      REDIS_URL: redis://localhost:6379/1
      LANGCHAIN_API_KEY_GEMINI: dummy
      OPENAI_API_KEY: dummy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Production Dependencies
        run: pip install -r requirements.txt
      - name: Install Test Dependencies
        run: pip install -r requirements-test.txt
      - name: Run Database Migrations
        run: python -m alembic upgrade head
      - name: Run Backend Tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v
        continue-on-error: true
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube:
    name: SonarCloud Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FEAT }}

  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build Image
        run: docker build -t ${{ secrets.ECR_REPOSITORY }}:latest .
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.ECR_REPOSITORY }}:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
      - name: Tag Image
        run: |
          docker tag \
            ${{ secrets.ECR_REPOSITORY }}:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
      - name: Push Image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
      - name: Upload docker-compose.yml to S3
        run: |
          aws s3 cp docker-compose.yml \
            s3://${{ secrets.S3_BUCKET_NAME }}/deployment/docker-compose.yml

  deploy:
    name: Deploy Backend
    needs: docker
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy using SSM
        run: |
          cat > commands.json <<'EOF'
          {
            "commands": [
              "mkdir -p /home/ubuntu/content-coach",
              "cd /home/ubuntu/content-coach",
              "aws s3 cp s3://S3_BUCKET_PLACEHOLDER/deployment/docker-compose.yml ./docker-compose.yml",
              "aws ecr get-login-password --region REGION_PLACEHOLDER | docker login --username AWS --password-stdin ACCOUNT_PLACEHOLDER.dkr.ecr.REGION_PLACEHOLDER.amazonaws.com",
              "docker compose pull",
              "docker compose up -d",
              "docker image prune -f"
            ]
          }
          EOF
          sed -i "s|S3_BUCKET_PLACEHOLDER|${{ secrets.S3_BUCKET_NAME }}|g" commands.json
          sed -i "s|REGION_PLACEHOLDER|${{ secrets.AWS_REGION }}|g" commands.json
          sed -i "s|ACCOUNT_PLACEHOLDER|${{ secrets.AWS_ACCOUNT_ID }}|g" commands.json

          ls -la commands.json && cat commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://commands.json \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
